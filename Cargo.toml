[package]
name = "sopra"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust-owned line editor for stock Zsh"
repository = "https://github.com/domenicurso/sopra"
readme = "README.md"
default-run = "sopra"

[[bin]]
name = "sopra"
path = "src/main.rs"

[dependencies]
brush-parser = "0.4"
libc = "0.2"
notify = "6"
neo_frizbee = "0.11"
ratatui = { version = "0.29", default-features = false }
zshrs = { path = "crates/zshrs", default-features = false, features = ["completion-only"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
