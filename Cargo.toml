[workspace]
members = [
    "crates/keel-core",
    "crates/keel-ui",
    "crates/keel-renderer",
    "crates/keel-scheduler",
    "crates/keel-module",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
insta = "1.43"
neo_frizbee = "0.11"
ratatui = { version = "0.29", default-features = false }
thiserror = "2"
tracing = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
