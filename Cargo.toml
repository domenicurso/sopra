[workspace]
members = [
    "crates/keel-cli",
    "crates/keel-complete",
    "crates/keel-core",
    "crates/keel-devtools",
    "crates/keel-editor",
    "crates/keel-history",
    "crates/keel-prompt",
    "crates/keel-render",
    "crates/keel-runtime",
    "crates/keel-shell",
    "crates/keel-terminal",
    "crates/keel-zsh-bridge",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
