[package]
name = "sopra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A Rust-owned line editor for stock Zsh"
repository = "https://github.com/domenicurso/sopra"
readme = "README.md"
default-run = "sopra-worker"

[workspace]
members = ["crates/completion", "crates/shell-context", "crates/widget-sdk"]
resolver = "3"

[[bin]]
name = "sopra-worker"
path = "src/main.rs"

[dependencies]
sopra = { package = "sopra-widget-sdk", path = "crates/widget-sdk" }
brush-parser = "0.4"
libc = "0.2"
notify = "6"
neo_frizbee = "0.11"
ratatui = { version = "0.30", default-features = false }
sopra-completion = { path = "crates/completion" }
sopra-shell-context = { path = "crates/shell-context" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
toml_edit = "0.25.17"
vt100 = "0.18.1"
portable-pty = "0.9"
tempfile = "3"
base64 = "0.22"
