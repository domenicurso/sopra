[package]
name = "sopra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A Rust-owned line editor for stock Zsh"
repository = "https://github.com/domenicurso/sopra"
readme = "README.md"
default-run = "sopra"

[workspace]
members = ["crates/completion"]
resolver = "3"

[[bin]]
name = "sopra"
path = "src/main.rs"

[dependencies]
brush-parser = "0.4"
libc = "0.2"
notify = "6"
neo_frizbee = "0.11"
ratatui = { version = "0.29", default-features = false }
sopra-completion = { path = "crates/completion" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
