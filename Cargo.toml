[package]
name = "keel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Rust-owned line editor demo for stock Zsh"
default-run = "keel-demo"

[[bin]]
name = "keel-demo"
path = "src/main.rs"

[dependencies]
libc = "0.2"
ratatui = { version = "0.29", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
