[workspace]
members = [
    "crates/keel-core",
    "crates/keel-ui",
    "crates/keel-renderer",
    "crates/keel-augment",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"
