[package]
name = "sopra-completion"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native shell completion engine for Sopra"
repository = "https://github.com/domenicurso/sopra"

[dependencies]
brush-parser = "0.4"
libc = "0.2"
neo_frizbee = "0.11"
notify = "6"
unicode-width = "0.2"
sopra-shell-context = { path = "../shell-context" }
toml_edit = "0.25.17"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
